# Streamlit theme for the Cyber UI (app.py loads assets/cyber.css on top of this).
# Defining both [theme.light] and [theme.dark] turns on the light/dark switch in the app's
# menu (top right, three dots, Settings). app.py makes dark the default on a first visit.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#0E7490"            # deep cyan: slider, focus rings
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"

[theme.dark]
primaryColor = "#22D3EE"            # neon cyan
backgroundColor = "#05060A"         # deep black under the grid
secondaryBackgroundColor = "#0D1322"
textColor = "#E2E8F0"

[client]
toolbarMode = "viewer"              # hide developer menu items, keep the theme switch
